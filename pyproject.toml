[project]
name = "banco-agil-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]


[tool.pytest.ini_options]
testpaths =["tests"]
pythonpath =["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[toll.ruff.lint]
select = ["E", "F", "i", "B"]

[toll.mypy]
python_version ="3.12"
strict = true
files = ["app"]